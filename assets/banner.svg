<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Pipeline Glow & Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }
      .stage-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
      }
      
      /* Dynamic animated pipeline dashes and pulses */
      @keyframes dash {
        to {
          stroke-dashoffset: -120;
        }
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.18);
          opacity: 1;
          filter: drop-shadow(0 0 12px #38bdf8);
        }
      }
      @keyframes floatSlow {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      .pipe-active {
        stroke-dasharray: 8, 8;
        animation: dash 2.5s linear infinite;
      }
      .pulse-node {
        transform-origin: center;
        animation: pulse 3s ease-in-out infinite;
      }
      .floating-stage {
        animation: floatSlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Matrix / Grid pattern in background -->
  <g opacity="0.12" stroke="#475569" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
  </g>

  <!-- Dynamic Background CI/CD Flow Track (placed low & behind) -->
  <g opacity="0.85">
    <!-- Connecting pipeline trace -->
    <path d="M 120 280 L 360 280 L 600 280 L 840 280 L 1080 280" 
          fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120 280 L 360 280 L 600 280 L 840 280 L 1080 280" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" class="pipe-active" stroke-linecap="round"/>

    <!-- Pipeline Nodes / Stage Indicators -->
    <!-- Node 1: Code / Commit -->
    <g transform="translate(120, 280)">
      <circle r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle r="6" fill="#38bdf8" class="pulse-node"/>
      <text y="-28" text-anchor="middle" class="stage-text">1. Commit</text>
    </g>

    <!-- Node 2: Build / Test -->
    <g transform="translate(360, 280)">
      <circle r="18" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <circle r="6" fill="#818cf8" class="pulse-node" style="animation-delay: 0.6s;"/>
      <text y="-28" text-anchor="middle" class="stage-text">2. Test &amp; Build</text>
    </g>

    <!-- Node 3: Package & Image -->
    <g transform="translate(600, 280)">
      <circle r="18" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
      <circle r="6" fill="#a855f7" class="pulse-node" style="animation-delay: 1.2s;"/>
      <text y="-28" text-anchor="middle" class="stage-text">3. Containerize</text>
    </g>

    <!-- Node 4: Security Scan -->
    <g transform="translate(840, 280)">
      <circle r="18" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
      <circle r="6" fill="#ec4899" class="pulse-node" style="animation-delay: 1.8s;"/>
      <text y="-28" text-anchor="middle" class="stage-text">4. SAST &amp; Gate</text>
    </g>

    <!-- Node 5: GitOps Deploy -->
    <g transform="translate(1080, 280)">
      <circle r="18" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle r="6" fill="#34d399" class="pulse-node" style="animation-delay: 2.4s;"/>
      <text y="-28" text-anchor="middle" class="stage-text">5. Deploy</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Badges (Never obscured) -->
  <g transform="translate(80, 50)">
    <!-- Top Pill Tag -->
    <g>
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="15" cy="14" r="5" fill="#38bdf8"/>
      <text x="30" y="18" class="pill-text">DEVOPS &amp; GITOPS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">
      Continuous Integration &amp; Continuous Delivery
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" class="subtitle-text">
      The Ultimate Curated Catalog of Cloud SaaS Platforms &amp; High-Star Open-Source Engines
    </text>

    <!-- Feature Highlights / Badges in Banner -->
    <g transform="translate(0, 138)">
      <!-- Pill 1 -->
      <g>
        <rect width="130" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
        <text x="65" y="17" text-anchor="middle" class="pill-text" fill="#38bdf8">⚡ Fast Runners</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="145" height="26" rx="6" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
        <text x="72" y="17" text-anchor="middle" class="pill-text" fill="#818cf8">🐳 Container Native</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(299, 0)">
        <rect width="155" height="26" rx="6" fill="#0f172a" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
        <text x="77" y="17" text-anchor="middle" class="pill-text" fill="#34d399">🔄 GitOps Delivery</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(466, 0)">
        <rect width="140" height="26" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
        <text x="70" y="17" text-anchor="middle" class="pill-text" fill="#f59e0b">🛡️ Enterprise SLA</text>
      </g>
    </g>
  </g>
</svg>
